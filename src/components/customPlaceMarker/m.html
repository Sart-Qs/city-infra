<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class='' style="width: 300px; height: 200px;">
        <div class="photo_container">
            <div class="photo">

            </div>
        </div>
        <div class="info_container">
            <div>
                <div class="profile">
                    <div class="profile_img"></div>
                    <div class="profile_info">
                        <div class="profile_name">
                            Алексей Мильчаков
                        </div>
                        <div class="content">
                            Яндекс хуйня
                        </div>
                        <button class="like_button">
                            <img src="../../assets/like_circle.svg" style="position: absolute; transform: translate(-50%, -50%);"/>
                        </button>
                    </div>
                </div>

            </div>
        </div>
        <div class="comment_container">

        </div>
    </div>

    <style>
        .like_button{
            border: 2px;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        .photo img {
            width: 100%;
            height: 100%;
        }
        .profile{
            display: flex;
            gap: 10px;
        }
        .content{
            font-size: 15px;
        }
        .profile_img{
        }
        .profile_img img{
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }
    </style>
    <script>
        const container = document.querySelector(".photo");
        const img = document.createElement("img")
        img.src = "./r.png"
        container.appendChild(img);
                document.querySelector(".profile_img").appendChild(img)
    </script>
</body>
</html>
